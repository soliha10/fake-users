services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: faker
      POSTGRES_PASSWORD: faker
      POSTGRES_DB: faker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faker"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
