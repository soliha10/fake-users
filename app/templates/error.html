{% extends "base.html" %}
{% import "macros.html" as ui %}
{% block title %}{{ title }} · Fake User Generator{% endblock %}
{% block content %}
<section class="card error-card">
  <span class="error-icon">{{ ui.icon("alert", size=24) }}</span>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for('index') }}">Back to the generator</a>
</section>
{% endblock %}
